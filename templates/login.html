<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Forge - Login</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">
    <div class="card">

        <h1>Career Forge</h1>
        <h4 style="text-align: center;">Welcome Back! </h4>

        <form action="/login" method="POST">

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <div class="password-input-wrapper">
                <input
                    type="password"
                    id="login-password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

                <button
                    type="button"
                    class="password-toggle"
                    data-target="login-password"
                    aria-label="Show password"
                    aria-pressed="false"
                    title="Show password">

                    <svg viewBox="0 0 24 24"
                        class="eye-icon"
                        aria-hidden="true">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>

                </button>
            </div>

            <button type="submit">Login</button>

        </form>

        <p class="login-text">
            Don't have an account?
            <a href="/register">Register</a>
        </p>

    </div>
</div>

<script>
document.querySelectorAll(".password-toggle").forEach(function (button) {

    button.addEventListener("click", function () {

        const passwordField = document.getElementById(
            button.dataset.target
        );

        if (!passwordField) {
            return;
        }

        const shouldShow = passwordField.type === "password";

        passwordField.type = shouldShow ? "text" : "password";

        button.setAttribute(
            "aria-pressed",
            shouldShow ? "true" : "false"
        );

        button.setAttribute(
            "aria-label",
            shouldShow ? "Hide password" : "Show password"
        );

        button.setAttribute(
            "title",
            shouldShow ? "Hide password" : "Show password"
        );

        button.innerHTML = shouldShow
            ? `<svg viewBox="0 0 24 24" class="eye-icon" aria-hidden="true">
                   <path d="M3 3l18 18"/>
                   <path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.2 4.1"/>
                   <path d="M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/>
                   <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
               </svg>`
            : `<svg viewBox="0 0 24 24" class="eye-icon" aria-hidden="true">
                   <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                   <circle cx="12" cy="12" r="3"/>
               </svg>`;
    });

});
</script>

</body>
</html>
